name: Bug report
description: Report a reproducible bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach API keys, real phone numbers, or private chat content.
        For security issues, use Security Advisories instead of a public issue.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "1.0.0 or commit hash"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - WhatsApp / QR
        - AI replies
        - Coba Chat
        - Dashboard
        - Accounts and login
        - Business profile
        - Catalog
        - Payments and QRIS
        - Orders
        - Status
        - Import
        - Database
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Node.js
      placeholder: "Windows 11, Node 24"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (redact private data)
      render: shell
