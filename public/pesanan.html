<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon-v2.ico" sizes="any" />
    <title>Pesanan - Tutur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/auth.css" />
  </head>
  <body>
    <main class="auth-shell" style="max-width: 820px">
      <a class="brand" href="/">
        <span class="brand-mark">T</span>
        <span>
          <strong>Tutur</strong>
          <small>Pesanan masuk</small>
        </span>
      </a>

      <section class="card">
        <h1>Pesanan</h1>
        <p class="lede">
          Pesanan yang dicatat Tutur dari percakapan. Periksa nama, item, dan total sebelum
          dikonfirmasi ke pembeli.
        </p>
        <div id="orders" class="orders">
          <p class="muted">Memuat pesanan...</p>
        </div>
        <p class="switch"><a href="/dashboard">Kembali ke dashboard</a></p>
      </section>
    </main>

    <script type="module" src="/pesanan.js"></script>
  </body>
</html>
