<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon-v2.ico" sizes="any" />
    <title>Profil usaha - Tutur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/auth.css" />
  </head>
  <body>
    <main class="auth-shell" style="max-width: 720px">
      <a class="brand" href="/">
        <span class="brand-mark">T</span>
        <span>
          <strong>Tutur</strong>
          <small>Profil usaha</small>
        </span>
      </a>

      <section class="card">
        <h1>Profil usaha Anda</h1>
        <p class="lede">
          Data ini dipakai Tutur untuk menjawab pertanyaan pelanggan. Isi sekali, bisa diubah nanti.
        </p>

        <div class="alert" id="alert" hidden></div>

        <form id="business-form">
          <div class="field">
            <label for="name">Nama usaha</label>
            <input id="name" type="text" required maxlength="120" placeholder="Contoh: Sari Kitchen" />
          </div>

          <div class="field">
            <label for="category">Jenis usaha</label>
            <select id="category">
              <option value="Warung makan">Warung makan</option>
              <option value="Kafe">Kafe</option>
              <option value="Homestay">Homestay</option>
              <option value="Toko">Toko</option>
              <option value="Jasa">Jasa</option>
              <option value="Lainnya">Lainnya</option>
            </select>
          </div>

          <div class="field">
            <label for="location">Lokasi</label>
            <input id="location" type="text" maxlength="200" placeholder="Contoh: Jl. Raya Ubud, Gianyar" />
          </div>

          <div class="field">
            <label for="hours">Jam buka</label>
            <input id="hours" type="text" maxlength="120" placeholder="Contoh: Setiap hari 08.00-21.00" />
          </div>

          <div class="field">
            <label for="specialty">Keunggulan atau menu andalan</label>
            <textarea id="specialty" rows="2" maxlength="400" placeholder="Contoh: Nasi campur vegan, ayam bakar halal"></textarea>
          </div>

          <div class="field">
            <label for="contact">Nomor WhatsApp atau telepon</label>
            <input id="contact" type="text" maxlength="60" placeholder="Contoh: 0812 3456 7890" />
          </div>

          <div class="field">
            <label for="notes">Catatan lain</label>
            <textarea id="notes" rows="3" maxlength="600" placeholder="Contoh: Bisa antar radius 5 km, menerima QRIS"></textarea>
          </div>

          <button class="btn btn-primary" type="submit" id="save">Simpan dan buka dashboard</button>
        </form>
      </section>
    </main>

    <script type="module" src="/profil-usaha.js"></script>
  </body>
</html>
