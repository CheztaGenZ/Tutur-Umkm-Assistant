<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon-v2.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-192-v2.png" />
    <title>Persetujuan - Tutur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/auth.css" />
  </head>
  <body>
    <main class="auth-shell">
      <a class="brand" href="/">
        <span class="brand-mark">T</span>
        <span>
          <strong>Tutur</strong>
          <small>Asisten chat untuk usaha Bali</small>
        </span>
      </a>

      <section class="card">
        <h1>Sebelum mulai</h1>
        <p class="lede">
          Baca dua dokumen ini dulu. Setelah setuju, Tutur boleh memakai data bisnis dan percakapan
          untuk membuat balasan.
        </p>

        <div class="stack">
          <a class="btn btn-secondary" href="/terms.html" target="_blank" rel="noopener">
            Baca Ketentuan Layanan
          </a>
          <a class="btn btn-secondary" href="/privacy.html" target="_blank" rel="noopener">
            Baca Kebijakan Privasi
          </a>
        </div>

        <label class="consent" style="margin-top: 20px">
          <input type="checkbox" id="agree" />
          <span>
            Saya sudah membaca dan menyetujui Ketentuan Layanan dan Kebijakan Privasi, termasuk
            pemrosesan data oleh model AI.
          </span>
        </label>

        <p class="fine-print" id="status" role="status"></p>

        <button class="btn btn-primary" type="button" id="accept" disabled>
          Saya setuju dan lanjut
        </button>
      </section>
    </main>

    <script type="module" src="/persetujuan.js"></script>
  </body>
</html>
